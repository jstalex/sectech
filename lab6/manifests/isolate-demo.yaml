apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: isolate-demo
  namespace: demo
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
  - fromEndpoints:
    - matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
        - demo
  egressDeny:
  - toEndpoints:
    - matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
        - demo
        - kube-system
