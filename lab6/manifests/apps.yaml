apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: demo
  labels:
    app: web
spec:
  containers:
  - name: web
    image: lab6-demo:local
    imagePullPolicy: Never
    command:
    - sh
    - -c
    - sleep infinity
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  containers:
  - name: api
    image: lab6-demo:local
    imagePullPolicy: Never
    ports:
    - containerPort: 5000
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: demo
  labels:
    app: db
spec:
  containers:
  - name: db
    image: postgres:17-alpine
    env:
    - name: POSTGRES_HOST_AUTH_METHOD
      value: trust
    ports:
    - containerPort: 5432
    readinessProbe:
      exec:
        command:
        - pg_isready
        - -U
        - postgres
      initialDelaySeconds: 3
      periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
spec:
  selector:
    app: api
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: demo
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
