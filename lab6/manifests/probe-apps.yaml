apiVersion: v1
kind: Namespace
metadata:
  name: other
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: other
  labels:
    app: web
spec:
  containers:
  - name: web
    image: lab6-demo:local
    imagePullPolicy: Never
    command:
    - sh
    - -c
    - sleep infinity
---
apiVersion: v1
kind: Namespace
metadata:
  name: outside-target
---
apiVersion: v1
kind: Pod
metadata:
  name: echo
  namespace: outside-target
  labels:
    app: echo
spec:
  containers:
  - name: echo
    image: lab6-demo:local
    imagePullPolicy: Never
